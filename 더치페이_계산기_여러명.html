<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>더치페이 계산기</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f5f7;color:#17202a;margin:0;padding:16px}main{max-width:560px;margin:auto}h1{font-size:26px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0}button,input,select{font:inherit;padding:12px;border:1px solid #ccd3da;border-radius:10px;width:100%;box-sizing:border-box;background:white}button{font-weight:700;cursor:pointer}.tabs,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.active,.primary{background:#1e3a5f;color:white}.hidden{display:none}label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}.muted{color:#637080;font-size:14px;line-height:1.5}.result{background:#edf4fb;border-radius:12px;padding:14px;margin-top:14px}.big{font-size:28px;font-weight:800;margin:8px 0}.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #d9e4ef}.line:last-child{border:0}.error{color:#b42318;font-size:14px}.example{font-size:14px;background:#f5f6f8;border-radius:10px;padding:10px;line-height:1.5}
</style></head><body><main>
<h1>더치페이 계산기</h1><p class="muted">독립 실행형 HTML 파일입니다. 인터넷 연결 없이 계산할 수 있습니다.</p>
<div class="tabs"><button id="eqtab" class="active">균등 나누기</button><button id="sptab">금액 다르게 내기</button></div>
<section class="card">
<label for="total">총 금액 (원)</label><input id="total" type="number" min="0" step="1" value="125000" inputmode="numeric">
<div id="eq">
<label for="people">전체 인원 (명)</label><input id="people" type="number" min="1" step="1" value="5" inputmode="numeric">
<label for="rounding">반올림 단위</label><select id="rounding"><option value="1">정확히 계산 (1원 단위)</option><option value="100">100원 단위</option><option value="1000">1,000원 단위</option><option value="10000">10,000원 단위</option></select>
</div>
<div id="sp" class="hidden">
<div class="grid"><div><label for="count">다른 금액을 낼 인원</label><input id="count" type="number" min="1" step="1" value="2" inputmode="numeric"></div><div><label for="amount">그 인원의 1인 금액 (원)</label><input id="amount" type="number" min="0" step="1" value="30000" inputmode="numeric"></div></div>
<label for="sppeople">전체 인원 (명)</label><input id="sppeople" type="number" min="2" step="1" value="6" inputmode="numeric">
<p class="example">예: 총 150,000원, 6명 중 2명이 각 30,000원을 내면 나머지 4명이 남은 90,000원을 나눠 냅니다.</p>
</div>
<button id="calc" class="primary" style="margin-top:18px">계산하기</button><p id="error" class="error"></p><div id="result" class="result" aria-live="polite"></div>
</section><p class="muted">나누어떨어지지 않으면 필요한 사람에게 1원씩 더해 총액이 정확히 맞도록 표시합니다. 반올림 모드는 반올림 후 총액과의 차이도 보여줍니다.</p>
</main>
<script>
const $=id=>document.getElementById(id), won=n=>Math.round(n).toLocaleString('ko-KR')+'원';let mode='eq';
function line(a,b){return '<div class="line"><span>'+a+'</span><strong>'+b+'</strong></div>'}
function fail(s){$('error').textContent=s;$('result').innerHTML=''}
function modeSet(m){mode=m;$('eq').classList.toggle('hidden',m!=='eq');$('sp').classList.toggle('hidden',m!=='sp');$('eqtab').classList.toggle('active',m==='eq');$('sptab').classList.toggle('active',m==='sp');calc()}
function calc(){
$('error').textContent='';let total=Number($('total').value);
if(!Number.isSafeInteger(total)||total<0)return fail('총 금액은 0원 이상의 정수로 입력해 주세요.');
if(mode==='eq'){
let p=Number($('people').value),u=Number($('rounding').value);
if(!Number.isInteger(p)||p<1)return fail('전체 인원은 1명 이상의 정수로 입력해 주세요.');
if(u===1){let base=Math.floor(total/p),extra=total%p;$('result').innerHTML='<b>계산 결과</b><div class="big">'+won(base)+(extra?'부터':'')+'</div>'+line('전체 인원',p+'명')+line('기본 금액',won(base)+'씩')+line('1원 추가 부담',extra?extra+'명이 '+won(base+1)+'씩':'없음')+line('총액 확인',won(total))}
else{let each=Math.round((total/p)/u)*u,sum=each*p,diff=sum-total;$('result').innerHTML='<b>반올림 계산 결과</b><div class="big">'+won(each)+'</div>'+line('1인 금액',won(each)+'씩')+line('인원',p+'명')+line('나눠 낸 합계',won(sum))+line('총액과의 차이',diff===0?'차이 없음':(diff>0?'초과 ':'부족 ')+won(Math.abs(diff)))}
}else{
let c=Number($('count').value),a=Number($('amount').value),p=Number($('sppeople').value);
if(!Number.isInteger(p)||p<2)return fail('전체 인원은 2명 이상으로 입력해 주세요.');
if(!Number.isInteger(c)||c<1||c>=p)return fail('다른 금액을 낼 인원은 1명 이상이며 전체 인원보다 적어야 합니다.');
if(!Number.isSafeInteger(a)||a<0)return fail('1인 금액은 0원 이상의 정수로 입력해 주세요.');
let fixed=c*a;if(!Number.isSafeInteger(fixed)||fixed>total)return fail('다른 금액을 내는 사람들의 합계가 총 금액을 넘습니다.');
let restp=p-c,rest=total-fixed,base=Math.floor(rest/restp),extra=rest%restp;
$('result').innerHTML='<b>계산 결과</b>'+line('다른 금액을 내는 사람',c+'명 × '+won(a))+line('해당 인원 합계',won(fixed))+line('나머지 인원',restp+'명')+line('나머지 인원 기본 금액',won(base)+'씩')+line('1원 추가 부담',extra?extra+'명이 '+won(base+1)+'씩':'없음')+line('총액 확인',won(total))
}}
$('eqtab').onclick=()=>modeSet('eq');$('sptab').onclick=()=>modeSet('sp');$('calc').onclick=calc;
['total','people','rounding','count','amount','sppeople'].forEach(id=>$(id).addEventListener('input',calc));modeSet('eq');
</script></body></html>
