<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="더치페이">
<meta name="theme-color" content="#E7ECF3">
<title>더치페이 계산기</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#E7ECF3; --paper:#FFFFFF; --ink:#1C2333; --sub:#667089; --line:#D5DBE6;
  --accent:#2B3A8C; --mark:#FFE066; --warn:#C0392B; --field:#F3F5F9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --paper:#1D2433; --ink:#E9EDF5; --sub:#9AA3B8; --line:#2E3850;
    --accent:#9FB0FF; --mark:#6B5A12; --warn:#FF7A6B; --field:#262E40;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --paper:#1D2433; --ink:#E9EDF5; --sub:#9AA3B8; --line:#2E3850;
  --accent:#9FB0FF; --mark:#6B5A12; --warn:#FF7A6B; --field:#262E40;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
main{max-width:440px; margin:0 auto; padding:20px 16px 40px}
h1{font-size:22px; font-weight:700; margin:8px 4px 16px; letter-spacing:-.02em}
.receipt{
  background:var(--paper); padding:20px 18px 28px; position:relative;
  border-radius:14px 14px 0 0;
}
.receipt::after{
  content:""; position:absolute; left:0; right:0; bottom:-10px; height:10px;
  background:
    linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x,
    linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x;
}
label.k{display:block; font-size:14px; color:var(--sub); margin:0 0 6px}
.row{margin-bottom:18px}
.money{
  display:flex; align-items:baseline; gap:6px; background:var(--field);
  border-radius:10px; padding:10px 14px;
}
.money input{
  flex:1; min-width:0; border:0; background:transparent; color:var(--ink);
  font:inherit; font-size:28px; font-weight:700; outline:none; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.money span{color:var(--sub)}
.money:focus-within{box-shadow:0 0 0 2px var(--accent)}
.stepper{display:flex; align-items:center; gap:10px}
.stepper button{
  width:48px; height:48px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:24px; line-height:1; cursor:pointer;
}
.stepper button:active{background:var(--field)}
.stepper output{font-size:28px; font-weight:700; min-width:64px; text-align:center}
.seg{display:flex; background:var(--field); border-radius:10px; padding:4px}
.seg button{
  flex:1; border:0; background:transparent; color:var(--sub); font:inherit; font-size:15px;
  padding:8px 0; border-radius:7px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--paper); color:var(--ink); font-weight:700}
hr{border:0; border-top:1.5px dashed var(--line); margin:22px 0}
.ex{display:grid; grid-template-columns:1fr 1.3fr 40px; gap:8px; margin-bottom:8px}
.ex input{
  width:100%; border:0; background:var(--field); color:var(--ink); border-radius:10px;
  padding:12px; font:inherit; font-size:16px; outline:none;
}
.ex input:focus{box-shadow:0 0 0 2px var(--accent)}
.ex .del{
  border:0; background:transparent; color:var(--sub); font-size:22px; cursor:pointer; border-radius:10px;
}
.add{
  width:100%; border:1.5px dashed var(--line); background:transparent; color:var(--accent);
  font:inherit; font-size:15px; font-weight:500; padding:11px; border-radius:10px; cursor:pointer;
}
.hint{font-size:13px; color:var(--sub); margin:6px 0 0}
.result{margin-top:34px; padding:0 4px}
.big{font-size:15px; color:var(--sub)}
.big strong{
  display:block; font-size:44px; color:var(--ink); letter-spacing:-.03em; line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.big strong mark{background:linear-gradient(transparent 60%,var(--mark) 60%); color:inherit; padding:0 2px}
.lines{margin:18px 0 0; padding:0; list-style:none; font-variant-numeric:tabular-nums}
.lines li{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line)}
.lines li:last-child{border-bottom:0}
.lines .s{color:var(--sub)}
.err{color:var(--warn); font-weight:500; margin-top:14px}
.copy{
  margin-top:20px; width:100%; border:0; border-radius:12px; background:var(--accent);
  color:var(--paper); font:inherit; font-size:17px; font-weight:700; padding:15px; cursor:pointer;
}
.copy:disabled{opacity:.4}
.reset{display:block; margin:14px auto 0; background:none; border:0; color:var(--sub); font:inherit; font-size:14px; text-decoration:underline; cursor:pointer}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>더치페이 계산기</h1>

  <section class="receipt">
    <div class="row">
      <label class="k" for="total">총 금액</label>
      <div class="money"><input id="total" inputmode="numeric" autocomplete="off" placeholder="0"><span>원</span></div>
    </div>

    <div class="row">
      <label class="k">전체 인원</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="한 명 빼기">−</button>
        <output id="count">2</output>
        <button type="button" id="plus" aria-label="한 명 더하기">+</button>
        <span style="color:var(--sub)">명</span>
      </div>
    </div>

    <div class="row" style="margin-bottom:0">
      <label class="k">1인 금액 올림 단위</label>
      <div class="seg" id="unit">
        <button type="button" data-u="1">1원</button>
        <button type="button" data-u="10">10원</button>
        <button type="button" data-u="100">100원</button>
        <button type="button" data-u="1000">1,000원</button>
      </div>
    </div>

    <hr>

    <label class="k">금액을 따로 정한 사람</label>
    <div id="exList"></div>
    <button type="button" class="add" id="addEx">+ 따로 내는 사람 추가</button>
    <p class="hint">정한 금액을 먼저 빼고, 남은 금액을 나머지 인원이 나눕니다.</p>
  </section>

  <section class="result" aria-live="polite">
    <div class="big" id="bigLabel">1인당<strong><mark id="per">0</mark>원</strong></div>
    <ul class="lines" id="lines"></ul>
    <div class="err" id="err" hidden></div>
    <button type="button" class="copy" id="copy">카톡용 결과 복사</button>
    <button type="button" class="reset" id="reset">처음부터 다시</button>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('ko-KR');
const num = s => parseInt(String(s).replace(/[^\d]/g,''),10) || 0;

let state = { total:0, count:2, unit:100, ex:[] };
try{ const s = localStorage.getItem('dutchpay'); if(s) state = Object.assign(state, JSON.parse(s)); }catch(e){}
const save = () => { try{ localStorage.setItem('dutchpay', JSON.stringify(state)); }catch(e){} };

function bindMoney(input, get, set){
  input.value = get() ? fmt(get()) : '';
  input.addEventListener('input', () => {
    const v = num(input.value);
    set(v);
    input.value = v ? fmt(v) : '';
    calc();
  });
}

function renderEx(){
  const box = $('#exList'); box.innerHTML = '';
  state.ex.forEach((p, i) => {
    const row = document.createElement('div'); row.className = 'ex';
    const name = document.createElement('input');
    name.placeholder = '이름'; name.value = p.name || ''; name.setAttribute('aria-label','이름');
    name.addEventListener('input', () => { p.name = name.value; calc(); });
    const amt = document.createElement('input');
    amt.inputMode = 'numeric'; amt.placeholder = '낼 금액'; amt.setAttribute('aria-label','낼 금액');
    bindMoney(amt, () => p.amount, v => p.amount = v);
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label','삭제');
    del.addEventListener('click', () => { state.ex.splice(i,1); renderEx(); calc(); });
    row.append(name, amt, del); box.append(row);
  });
}

function calc(){
  $('#count').textContent = state.count;
  document.querySelectorAll('#unit button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.u === state.unit));

  const err = $('#err'), lines = $('#lines');
  const exSum = state.ex.reduce((a,p) => a + (p.amount||0), 0);
  const restN = state.count - state.ex.length;
  const rest = state.total - exSum;
  let msg = '';
  if(state.ex.length && restN < 1) msg = '따로 내는 사람이 전체 인원보다 많거나 같아요. 인원을 늘려주세요.';
  else if(rest < 0) msg = `따로 정한 금액(${fmt(exSum)}원)이 총 금액보다 커요.`;

  err.hidden = !msg; err.textContent = msg;
  $('#copy').disabled = !!msg || !state.total;
  lines.innerHTML = '';
  if(msg){ $('#per').textContent = '–'; save(); return null; }

  const raw = restN ? rest / restN : 0;
  const per = Math.ceil(raw / state.unit) * state.unit;
  const collected = per * restN + exSum;
  const surplus = collected - state.total;

  $('#per').textContent = fmt(per);
  $('#bigLabel').firstChild.nodeValue = state.ex.length ? `나머지 ${restN}명 1인당` : '1인당';

  const add = (l, r, sub) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="${sub?'s':''}"></span><span class="${sub?'s':''}"></span>`;
    li.children[0].textContent = l; li.children[1].textContent = r; lines.append(li);
  };
  state.ex.forEach((p,i) => add(p.name || `따로 내는 사람 ${i+1}`, fmt(p.amount||0)+'원'));
  if(state.ex.length) add(`나머지 ${restN}명`, `각 ${fmt(per)}원`);
  add('걷히는 돈', fmt(collected)+'원', true);
  if(surplus > 0) add('올림으로 남는 돈', fmt(surplus)+'원', true);

  save();
  return { per, restN, surplus, collected };
}

$('#minus').onclick = () => { if(state.count > 1){ state.count--; calc(); } };
$('#plus').onclick = () => { if(state.count < 99){ state.count++; calc(); } };
document.querySelectorAll('#unit button').forEach(b => b.onclick = () => { state.unit = +b.dataset.u; calc(); });
$('#addEx').onclick = () => {
  state.ex.push({ name:'', amount:0 });
  if(state.ex.length >= state.count) state.count = state.ex.length + 1;
  renderEx(); calc();
  const inputs = document.querySelectorAll('#exList input'); inputs[inputs.length-2]?.focus();
};
$('#reset').onclick = () => {
  state = { total:0, count:2, unit:100, ex:[] };
  $('#total').value = ''; renderEx(); calc();
};
$('#copy').onclick = async () => {
  const r = calc(); if(!r) return;
  let t = `💸 더치페이\n총 ${fmt(state.total)}원 / ${state.count}명\n`;
  state.ex.forEach((p,i) => t += `· ${p.name || '따로 내는 사람 '+(i+1)}: ${fmt(p.amount||0)}원\n`);
  t += state.ex.length ? `· 나머지 ${r.restN}명: 각 ${fmt(r.per)}원` : `· 1인당 ${fmt(r.per)}원`;
  if(r.surplus > 0) t += `\n(올림으로 ${fmt(r.surplus)}원 남음)`;
  const btn = $('#copy');
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.append(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove();
  }
  btn.textContent = '복사됨'; setTimeout(() => btn.textContent = '카톡용 결과 복사', 1500);
};

bindMoney($('#total'), () => state.total, v => state.total = v);
renderEx(); calc();
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
